<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캠퍼스 마감 플래너</title>
    <meta
      name="description"
      content="6~7개 수강 과목의 과제와 일정을 마감일순으로 자동 정렬하고 D-day와 D-3 긴급 마감을 한눈에 관리하는 대학생용 웹앱"
    />
    <meta property="og:title" content="캠퍼스 마감 플래너" />
    <meta
      property="og:description"
      content="6~7개 수강 과목의 과제와 일정을 마감일순으로 자동 정렬하고 D-day와 D-3 긴급 마감을 한눈에 관리하는 대학생용 웹앱"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-canvas: #f6f7f9;
        --bg-surface: #ffffff;
        --bg-subtle: #edf0f4;
        --bg-hover: #f8fafc;
        --bg-urgent: #fef2f2;
        --border-hairline: #e2e8f0;
        --border-strong: #cbd5e1;
        --border-urgent: #fca5a5;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent: #1d4ed8;
        --accent-hover: #1e40af;
        --accent-soft: #eff6ff;
        --danger: #dc2626;
        --danger-hover: #b91c1c;
        --warning: #b45309;
        --success: #15803d;
        --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-elevated: 0 12px 32px rgba(15, 23, 42, 0.14);
        --radius-panel: 16px;
        --radius-control: 10px;
        --radius-sm: 8px;
        --font-sans: 'Plus Jakarta Sans', 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        font-family: var(--font-sans);
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        background: none;
        border: none;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Top Header */
      .app-header {
        background-color: var(--bg-surface);
        border-bottom: 1px solid var(--border-hairline);
        position: sticky;
        top: 0;
        z-index: 30;
      }

      .header-inner {
        max-width: 1240px;
        margin: 0 auto;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 54px;
      }

      .brand-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .header-nav {
        display: none;
        align-items: center;
        gap: 28px;
      }

      .header-nav-link {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-secondary);
        padding: 6px 2px;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 160ms var(--ease-out), border-color 160ms var(--ease-out);
      }

      .header-nav-link:hover {
        color: var(--text-primary);
      }

      .header-nav-link.is-active {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }

      .header-cta {
        min-height: 40px;
        padding: 8px 16px;
        border-radius: var(--radius-control);
        background-color: var(--accent);
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 160ms var(--ease-out), transform 120ms var(--ease-out);
      }

      .header-cta:hover {
        background-color: var(--accent-hover);
      }

      .header-cta:active {
        transform: scale(0.98);
      }

      /* Main Workspace */
      .app-main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 20px 16px 56px;
      }

      .workspace-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }

      /* Left Composer Panel */
      .composer-backdrop {
        display: none;
      }

      .composer-panel {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-panel);
        padding: 20px;
        box-shadow: var(--shadow-card);
      }

      .composer-drag-handle {
        display: none;
      }

      .composer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .composer-title {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      .composer-close-btn {
        display: none;
        min-width: 44px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
      }

      .composer-close-btn:hover {
        background-color: var(--bg-subtle);
        color: var(--text-primary);
      }

      .form-stack {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .field-input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-control);
        background-color: var(--bg-surface);
        color: var(--text-primary);
        font-size: 0.9375rem;
        transition: border-color 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
      }

      .field-input::placeholder {
        color: var(--text-muted);
      }

      .field-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
      }

      .quick-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 2px;
      }

      .quick-btn {
        min-height: 32px;
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        background-color: var(--bg-subtle);
        color: var(--text-secondary);
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
        transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
      }

      .quick-btn:hover {
        background-color: #e2e8f0;
        color: var(--text-primary);
      }

      /* Segmented Priority Picker */
      .priority-segment {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        padding: 4px;
        background-color: var(--bg-subtle);
        border-radius: var(--radius-control);
      }

      .priority-btn {
        min-height: 40px;
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
      }

      .priority-btn:hover {
        color: var(--text-primary);
      }

      .priority-btn[aria-pressed='true'][data-value='상'] {
        background-color: var(--bg-surface);
        color: var(--danger);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      .priority-btn[aria-pressed='true'][data-value='중'] {
        background-color: var(--bg-surface);
        color: var(--warning);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      .priority-btn[aria-pressed='true'][data-value='하'] {
        background-color: var(--bg-surface);
        color: var(--text-primary);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      .form-error {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--danger);
        min-height: 1.25em;
      }

      .form-actions {
        display: flex;
        gap: 8px;
      }

      .btn-submit {
        flex: 1;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: var(--radius-control);
        background-color: var(--accent);
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 600;
        white-space: nowrap;
        transition: background-color 160ms var(--ease-out), transform 120ms var(--ease-out);
      }

      .btn-submit:hover {
        background-color: var(--accent-hover);
      }

      .btn-submit:active {
        transform: scale(0.985);
      }

      .btn-cancel-edit {
        min-height: 44px;
        padding: 10px 16px;
        border-radius: var(--radius-control);
        border: 1px solid var(--border-hairline);
        background-color: var(--bg-surface);
        color: var(--text-secondary);
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .btn-cancel-edit:hover {
        background-color: var(--bg-subtle);
        color: var(--text-primary);
      }

      /* Right Board Column */
      .board-column {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }

      .overview-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-hairline);
      }

      .overview-heading {
        margin: 0;
        font-size: clamp(1.375rem, 2.2vw, 1.75rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.25;
        text-wrap: balance;
      }

      .overview-sub {
        margin: 4px 0 0;
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      .summary-metrics {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .metric-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .metric-label {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-muted);
      }

      .metric-value {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.2;
        color: var(--text-primary);
      }

      .metric-value.is-danger {
        color: var(--danger);
      }

      /* Filter Toolbar */
      .toolbar {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .toolbar-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .status-tabs {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background-color: var(--bg-subtle);
        border-radius: var(--radius-control);
      }

      .status-tab {
        min-height: 38px;
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
      }

      .status-tab:hover {
        color: var(--text-primary);
      }

      .status-tab.is-active {
        background-color: var(--bg-surface);
        color: var(--text-primary);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      .search-wrap {
        position: relative;
        flex: 1;
        min-width: 200px;
        max-width: 320px;
      }

      .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      .search-input {
        width: 100%;
        min-height: 40px;
        padding: 8px 12px 8px 36px;
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-control);
        background-color: var(--bg-surface);
        font-size: 0.875rem;
      }

      .search-input:focus {
        outline: none;
        border-color: var(--accent);
      }

      /* Course Filter Row */
      .course-filter-row {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }

      .course-filter-row::-webkit-scrollbar {
        display: none;
      }

      .course-tab {
        min-height: 36px;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-hairline);
        background-color: var(--bg-surface);
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        flex-shrink: 0;
        transition: border-color 150ms var(--ease-out), background-color 150ms var(--ease-out), color 150ms var(--ease-out);
      }

      .course-tab:hover {
        border-color: var(--border-strong);
      }

      .course-tab.is-active {
        background-color: var(--course-ink, var(--text-primary));
        border-color: var(--course-ink, var(--text-primary));
        color: #ffffff !important;
      }

      /* Weekly Calendar Section */
      .weekly-calendar-section {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-panel);
        padding: 16px;
        box-shadow: var(--shadow-card);
      }

      .weekly-calendar-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .weekly-calendar-title-wrap {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .weekly-calendar-title {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .weekly-calendar-range {
        font-size: 0.8125rem;
        color: var(--text-muted);
      }

      .day-filter-reset {
        min-height: 32px;
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        background-color: var(--bg-subtle);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      .day-filter-reset:hover {
        background-color: #e2e8f0;
        color: var(--text-primary);
      }

      /* Mobile-first vertical day rows -> Desktop 7-column calendar */
      .weekly-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .week-day-cell {
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-control);
        background-color: var(--bg-hover);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: border-color 150ms var(--ease-out), background-color 150ms var(--ease-out);
      }

      .week-day-cell.is-today {
        background-color: var(--accent-soft);
        border-color: #93c5fd;
      }

      .week-day-cell.is-selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }

      .week-day-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 28px;
        padding: 0;
        text-align: left;
      }

      .week-day-label {
        font-size: 0.8125rem;
        font-weight: 700;
        color: var(--text-primary);
        white-space: nowrap;
      }

      .week-day-cell.is-today .week-day-label {
        color: var(--accent);
      }

      .week-day-count {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .week-day-events {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .week-day-empty {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .week-event-btn {
        width: 100%;
        min-height: 36px;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--course-border, var(--border-hairline));
        background-color: var(--course-soft, var(--bg-surface));
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 2px;
        transition: opacity 150ms var(--ease-out), transform 120ms var(--ease-out);
      }

      .week-event-btn:hover {
        transform: translateY(-1px);
      }

      .week-event-btn.is-completed {
        opacity: 0.45;
      }

      .week-event-course {
        font-size: 0.6875rem;
        font-weight: 700;
        color: var(--course-ink, var(--text-secondary));
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .week-event-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .week-event-btn.is-completed .week-event-title {
        text-decoration: line-through;
      }

      /* Card Grid */
      .cards-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .task-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-panel);
        padding: 16px 18px;
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: opacity 200ms var(--ease-out), transform 180ms var(--ease-out), border-color 160ms var(--ease-out), background-color 160ms var(--ease-out);
      }

      .task-card:hover {
        border-color: var(--border-strong);
      }

      /* D-3 이내 긴급 스타일 (no thick border-l-4) */
      .task-card.is-urgent {
        background-color: var(--bg-urgent);
        border-color: var(--border-urgent);
      }

      .task-card.is-urgent:hover {
        border-color: #f87171;
      }

      /* 완료 체크 시 흐리게 */
      .task-card.is-completed {
        opacity: 0.46;
        background-color: var(--bg-hover);
        border-color: var(--border-hairline);
      }

      .task-card.is-completed:hover {
        opacity: 0.72;
      }

      .card-top-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      /* Unboxed text metadata with typographic separator */
      .card-kicker {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 0.8125rem;
        color: var(--text-secondary);
        min-width: 0;
      }

      .card-course {
        font-weight: 700;
        color: var(--course-ink, var(--text-primary));
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 190px;
      }

      .card-priority {
        font-weight: 600;
      }

      .card-priority[data-priority='상'] {
        color: var(--danger);
      }

      .card-priority[data-priority='중'] {
        color: var(--warning);
      }

      .card-priority[data-priority='하'] {
        color: var(--text-muted);
      }

      .card-dday {
        font-family: var(--font-mono);
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--text-secondary);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .card-dday.is-urgent {
        color: var(--danger);
      }

      .card-dday.is-completed {
        font-family: var(--font-sans);
        font-weight: 600;
        color: var(--text-muted);
      }

      .card-main {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .check-btn {
        min-width: 44px;
        min-height: 44px;
        margin: -10px 0 -10px -10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-control);
        flex-shrink: 0;
      }

      .check-box {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        border: 1.75px solid var(--border-strong);
        background-color: var(--bg-surface);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        transition: background-color 150ms var(--ease-out), border-color 150ms var(--ease-out);
      }

      .check-btn:hover .check-box {
        border-color: var(--accent);
      }

      .task-card.is-completed .check-box {
        background-color: var(--text-secondary);
        border-color: var(--text-secondary);
      }

      .card-title-wrap {

        flex-direction: column;
        gap: 6px;

        font-weight: 700;
        color: var(--text-secondary);

        flex-direction: column;

        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(15, 23, 42, 0.06);

        border-top-color: rgba(220, 38, 38, 0.14);
      }

      .card-due-text {
        font-size: 0.8125rem;
        color: var(--text-muted);
      }

      .task-card.is-urgent .card-due-text {
        color: #991b1b;
        font-weight: 500;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-right: -8px;
      }

      .icon-action-btn {
        min-width: 40px;
        min-height: 40px;
        padding: 0 10px;
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
      }

      .icon-action-btn:hover {
        background-color: rgba(15, 23, 42, 0.06);
        color: var(--text-primary);
      }

      .icon-action-btn.is-delete:hover {
        background-color: rgba(220, 38, 38, 0.1);
        color: var(--danger);

      /* Completed Divider Label */
      .section-divider {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 2px 2px;
        border-top: 1px solid var(--border-hairline);
        margin-top: 4px;

      .section-divider-title {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .clear-completed-btn {

        padding: 4px 10px;
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;

      .clear-completed-btn:hover {

        color: var(--danger);

      /* Empty State */
      .empty-state {

      .empty-desc {

      .modal-backdrop {

      .modal-dialog {

        transition: transform 180ms var(--ease-out);

      .modal-backdrop.is-open .modal-dialog {

      .modal-title {
        margin: 0 0 8px;
        font-size: 1.0625rem;
        font-weight: 700;
        color: var(--text-primary);

      .modal-desc {
        margin: 0 0 20px;
        font-size: 0.875rem;
        color: var(--text-secondary);
        line-height: 1.55;

      .modal-target-name {
        font-weight: 600;
        color: var(--text-primary);

      .modal-actions {
        display: flex;
        justify-content: flex-end;

      .modal-btn-cancel {

        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;

      .modal-btn-cancel:hover {
        background-color: var(--bg-subtle);
        color: var(--text-primary);

      .modal-btn-danger {
        min-height: 44px;

      .syllabus-trigger-btn:hover {

      .type-btn {

        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        font-weight: 600;

      .team-input {

      .team-remove-btn {

      .syllabus-dialog-title {
        margin: 0;

      .syllabus-file-info {

        gap: 2px;

      .syllabus-file-title {

        color: var(--text-primary);
      }

      .syllabus-file-sub {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .syllabus-file-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .syllabus-file-btn {
        min-height: 40px;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background-color: var(--bg-surface);
        color: var(--text-primary);
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .syllabus-file-btn:hover {
        background-color: var(--bg-subtle);
      }

      .syllabus-attached-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        border: 1px solid #bfdbfe;
        border-radius: var(--radius-control);
        background-color: var(--accent-soft);
      }

      .syllabus-attached-bar[hidden] {
        display: none;
      }

      .syllabus-attached-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 0.8125rem;
        color: var(--accent);
        font-weight: 600;
      }

      .syllabus-attached-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .syllabus-attached-size {
        color: var(--text-secondary);
        font-weight: 500;
        flex-shrink: 0;

      .syllabus-textarea {

        color: var(--text-primary);
        font: inherit;
        font-size: 0.9375rem;
        line-height: 1.55;

        transition: border-color 150ms var(--ease-out), background-color 150ms var(--ease-out);

        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);

      .syllabus-input-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 10px;

      .syllabus-course-wrap {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
        gap: 6px;

      .syllabus-analyze-btn {

        border-radius: var(--radius-control);

        display: flex;
        flex-direction: column;
        gap: 12px;

      .syllabus-preview-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .syllabus-preview-title {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 700;
        color: var(--text-primary);

        color: var(--text-muted);

        color: var(--text-primary);

        font-weight: 600;

        transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);

        transform: translateX(-50%) translateY(0);

        padding: 10px 14px 10px 16px;

        align-items: center;
        gap: 14px;
        font-size: 0.875rem;
        white-space: nowrap;

        padding: 4px 10px;
        border-radius: var(--radius-sm);
        background-color: rgba(255, 255, 255, 0.14);
        color: #ffffff;

        font-weight: 600;

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }

    <header class="app-header">

    <script>
      (function () {
        'use strict';

        const STORAGE_KEY = 'campus_deadline_tasks_v1';
        const PRIORITY_WEIGHT = { 상: 3, 중: 2, 하: 1 };
        const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

        // High-contrast academic course palette (auto-assigned per course)
        const COURSE_PALETTE = [
          { ink: '#1D4ED8', soft: '#EFF6FF', border: '#BFDBFE' },
          { ink: '#0F766E', soft: '#F0FDFA', border: '#99F6E4' },
          { ink: '#6D28D9', soft: '#F5F3FF', border: '#DDD6FE' },
          { ink: '#B45309', soft: '#FFFBEB', border: '#FDE68A' },
          { ink: '#15803D', soft: '#F0FDF4', border: '#BBF7D0' },
          { ink: '#BE123C', soft: '#FFF1F2', border: '#FECDD3' },
          { ink: '#0369A1', soft: '#F0F9FF', border: '#BAE6FD' },
          { ink: '#A21CAF', soft: '#FDF4FF', border: '#F5D0FE' }
        ];

        function toYmd(date) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          return y + '-' + m + '-' + d;
        }

        function addDaysYmd(offset) {
          const now = new Date();
          const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset);
          return toYmd(target);
        }

        function parseLocalDate(ymd) {
          if (!ymd || typeof ymd !== 'string') return null;
          const parts = ymd.split('-');
          if (parts.length !== 3) return null;
          const y = Number(parts[0]);
          const m = Number(parts[1]);
          const d = Number(parts[2]);
          if (!y || !m || !d) return null;
          return new Date(y, m - 1, d);
        }

        function getTodayMidnight() {
          const now = new Date();
          return new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }

        function getCurrentWeekDays() {
          const today = getTodayMidnight();
          const dow = today.getDay();
          const mondayOffset = dow === 0 ? -6 : 1 - dow;
          const days = [];
          for (let i = 0; i < 7; i += 1) {
            const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + mondayOffset + i);
            days.push({
              date: d,
              ymd: toYmd(d),
              weekday: WEEKDAYS[d.getDay()],
              month: d.getMonth() + 1,
              dayNum: d.getDate(),
              isToday: toYmd(d) === toYmd(today)
            });
          }
          return days;
        }

        function isDateInCurrentWeek(ymd) {
          const days = getCurrentWeekDays();
          const start = days[0].ymd;
          const end = days[6].ymd;
          return ymd >= start && ymd <= end;
        }

        function getDdayInfo(dueDateStr, completed) {
          const due = parseLocalDate(dueDateStr);
          const today = getTodayMidnight();
          if (!due) {
            return { diffDays: 999, label: '-', urgencyText: '', isUrgent: false };
          }
          const diffDays = Math.round((due.getTime() - today.getTime()) / 86400000);
          let label = '';
          let urgencyText = '';

          if (diffDays === 0) {
            label = 'D-Day';
            urgencyText = '오늘 마감';
          } else if (diffDays > 0) {
            label = 'D-' + diffDays;
            if (diffDays <= 3) urgencyText = '마감 임박';
          } else {
            label = 'D+' + Math.abs(diffDays);
            urgencyText = '기한 지남';
          }

          return {
            diffDays: diffDays,
            label: label,
            urgencyText: urgencyText,
            isUrgent: !completed && diffDays <= 3
          };
        }

        function formatDueDateDisplay(dueDateStr) {
          const date = parseLocalDate(dueDateStr);
          if (!date) return dueDateStr;
          const m = date.getMonth() + 1;
          const d = date.getDate();
          const w = WEEKDAYS[date.getDay()];
          return m + '월 ' + d + '일 (' + w + ')';
        }

        function hashCourseName(name) {
          let hash = 0;
          for (let i = 0; i < name.length; i += 1) {
            hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
          }
          return hash;
        }

        function buildCourseColorMap(taskList) {
          const map = new Map();
          const usedSlots = new Set();
          const orderedCourses = [];

          taskList
            .slice()
            .sort(function (a, b) {
              return (a.createdAt || 0) - (b.createdAt || 0);
            })
            .forEach(function (t) {
              const name = (t.course || '').trim();
              if (name && orderedCourses.indexOf(name) === -1) {
                orderedCourses.push(name);
              }
            });

          orderedCourses.forEach(function (name) {
            let slot = hashCourseName(name) % COURSE_PALETTE.length;
            if (usedSlots.size < COURSE_PALETTE.length) {
              while (usedSlots.has(slot)) {
                slot = (slot + 1) % COURSE_PALETTE.length;
              }
              usedSlots.add(slot);
            }
            map.set(name, COURSE_PALETTE[slot]);
          });

          return map;
        }

        function createSeedTasks() {
          const now = Date.now();
          const weekDays = getCurrentWeekDays();
          const todayYmd = toYmd(getTodayMidnight());
          // Place tasks across this week and next week so all 3 tabs + weekly calendar are populated
          const wedOrMid = weekDays[2].ymd >= todayYmd ? weekDays[2].ymd : addDaysYmd(1);
          const friOrLate = weekDays[4].ymd >= todayYmd ? weekDays[4].ymd : addDaysYmd(2);
          const sunYmd = weekDays[6].ymd;

          return [
            {
              id: 'seed-1',
              course: '운영체제',
              title: '프로세스 스케줄링 시뮬레이터 구현',
              dueDate: addDaysYmd(0),
              priority: '상',
              completed: false,
              createdAt: now - 600000
            },
            {
              id: 'seed-2',
              course: '데이터베이스',
              title: 'ER 다이어그램 정규화 과제 제출',
              dueDate: wedOrMid,
              priority: '상',
              completed: false,
              createdAt: now - 500000
            },
            {
              id: 'seed-3',
              course: '확률과 통계',
              title: '5장 연습문제 풀이 스캔본 업로드',
              dueDate: friOrLate,
              priority: '중',
              completed: false,
              createdAt: now - 400000
            },
            {
              id: 'seed-4',
              course: '경영학개론',
              title: '팀 프로젝트 기업 사례 조사 초안',
              dueDate: sunYmd,
              priority: '중',
              isGroup: true,
              teamMembers: [
                { name: '김민수', role: '재무제표 · 시장 데이터 분석' },
                { name: '이서연', role: '경쟁사 사례 조사 및 발표' },
                { name: '박지훈', role: '보고서 편집 및 최종 제출' }
              ],
              completed: false,
              createdAt: now - 300000
            },
            {
              id: 'seed-5',
              course: '영어발표와 토론',
              title: '기말 프레젠테이션 개요서 작성',
              dueDate: addDaysYmd(9),
              priority: '하',
              completed: false,
              createdAt: now - 200000
            },
            {
              id: 'seed-6',
              course: '웹프로그래밍',
              title: '시맨틱 HTML 포트폴리오 레이아웃',
              dueDate: weekDays[0].ymd,
              priority: '중',
              completed: true,
              createdAt: now - 700000
            }
          ];
        }

        function loadTasks() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw === null) {
              const seeded = createSeedTasks();
              localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
              return seeded;
            }
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            return parsed.filter(function (item) {
              return item && typeof item.id === 'string' && typeof item.title === 'string';
            });
          } catch (e) {
            return [];
          }
        }

          }

        function sortTasks(list) {
          return list.slice().sort(function (a, b) {
            if (a.completed !== b.completed) {
              return a.completed ? 1 : -1;
            }
            const dateA = parseLocalDate(a.dueDate);
            const dateB = parseLocalDate(b.dueDate);
            const timeA = dateA ? dateA.getTime() : Number.MAX_SAFE_INTEGER;
            const timeB = dateB ? dateB.getTime() : Number.MAX_SAFE_INTEGER;
            if (timeA !== timeB) {
              return timeA - timeB;
            }
            const weightA = PRIORITY_WEIGHT[a.priority] || 1;
            const weightB = PRIORITY_WEIGHT[b.priority] || 1;
            if (weightA !== weightB) {
              return weightB - weightA;
            }
            return (a.createdAt || 0) - (b.createdAt || 0);
          });
        }

        function renderBoard() {
          const colorMap = buildCourseColorMap(tasks);
          renderSummaryMetrics();
          renderCourseHelpers(colorMap);
          renderWeeklyCalendar(colorMap);

          const sorted = sortTasks(tasks);
          const query = searchQuery.trim().toLowerCase();

          const filtered = sorted.filter(function (task) {
            if (activeCourseFilter !== 'ALL' && task.course !== activeCourseFilter) {
              return false;
            }
            if (activeTab === 'week') {
              if (!isDateInCurrentWeek(task.dueDate)) return false;
              if (activeWeekDayFilter && task.dueDate !== activeWeekDayFilter) return false;
            } else if (activeTab === 'completed') {
              if (!task.completed) return false;
            }
            if (query) {
              const hay = (task.course + ' ' + task.title).toLowerCase();
              if (hay.indexOf(query) === -1) return false;
            }
            return true;
          });

          if (filtered.length === 0) {
            const hasFilters =
              activeCourseFilter !== 'ALL' ||
              Boolean(searchQuery.trim()) ||
              Boolean(activeWeekDayFilter);

            let emptyTitle = '등록된 과제나 일정이 없습니다';
            let emptyDesc = '이번 학기 과목과 마감일을 등록하면 D-day 순으로 자동 정렬됩니다.';

            if (activeTab === 'completed' && !hasFilters) {
              emptyTitle = '완료된 과제가 아직 없습니다';
              emptyDesc = '과제 카드의 체크 버튼을 눌러 완료 처리하면 이곳에 모입니다.';
            } else if (activeTab === 'week' && !hasFilters) {
              emptyTitle = '이번 주 마감 과제가 없습니다';
              emptyDesc = '전체 탭에서 다음 주 일정을 확인하거나 새 과제를 등록해 보세요.';
            } else if (hasFilters) {
              emptyTitle = '조건에 맞는 과제가 없습니다';
              emptyDesc = '선택한 요일·과목 필터나 검색어를 초기화하면 다른 과제를 볼 수 있습니다.';
            }

            cardsGrid.innerHTML =
              '<div class="empty-state" style="grid-column: 1 / -1;">' +
              '  <p class="empty-title">' +
              emptyTitle +
              '</p>' +
              '  <p class="empty-desc">' +
              emptyDesc +
              '</p>' +
              (hasFilters
                ? '<button type="button" id="resetFiltersBtn" class="btn-cancel-edit">필터 초기화</button>'
                : activeTab === 'week'
                  ? '<button type="button" id="switchToAllBtn" class="btn-cancel-edit">전체 과제 보기</button>'
                  : '<button type="button" id="emptyAddBtn" class="header-cta">새 과제 등록하기</button>') +
              '</div>';

            const resetFiltersBtn = document.getElementById('resetFiltersBtn');
            if (resetFiltersBtn) {
              resetFiltersBtn.addEventListener('click', function () {
                activeCourseFilter = 'ALL';
                activeWeekDayFilter = '';
                searchQuery = '';
                searchInput.value = '';
                renderBoard();
              });
            }

            const switchToAllBtn = document.getElementById('switchToAllBtn');
            if (switchToAllBtn) {
              switchToAllBtn.addEventListener('click', function () {
                setActiveTab('all');
              });

        function formatFileSize(bytes) {
          if (bytes < 1024) return bytes + 'B';
          if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + 'KB';
          return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
        }

        function clearAttachedSyllabusFile(clearCsvText) {
          attachedPdfFile = null;
          syllabusFileInput.value = '';
          syllabusAttachedBar.hidden = true;
          syllabusAttachedName.textContent = '';
          syllabusAttachedSize.textContent = '';
          if (clearCsvText) {
            syllabusTextarea.value = '';
          }
        }

        function readFileAsBase64(file) {
          return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onload = function () {
              const result = typeof reader.result === 'string' ? reader.result : '';
              const commaIndex = result.indexOf(',');
              resolve(commaIndex >= 0 ? result.slice(commaIndex + 1) : result);
            };
            reader.onerror = function () {
              reject(new Error('파일을 읽을 수 없습니다.'));
            };
            reader.readAsDataURL(file);
          });
        }

        async function readCsvFileText(file) {
          const buffer = await file.arrayBuffer();
          try {
            return new TextDecoder('utf-8', { fatal: true }).decode(buffer).replace(/^\uFEFF/, '');
          } catch (e) {
            try {
              return new TextDecoder('euc-kr').decode(buffer);
            } catch (e2) {
              return new TextDecoder('utf-8').decode(buffer);
            }
          }
        }

        async function handleSelectedSyllabusFile(file) {
          if (!file) return;
          syllabusError.textContent = '';

          const lowerName = (file.name || '').toLowerCase();
          const isPdf = file.type === 'application/pdf' || lowerName.endsWith('.pdf');
          const isCsv =
            file.type === 'text/csv' ||
            file.type === 'application/vnd.ms-excel' ||
            lowerName.endsWith('.csv');

          if (!isPdf && !isCsv) {
            syllabusError.textContent = 'PDF(.pdf) 또는 CSV(.csv) 파일만 선택할 수 있습니다.';
            syllabusFileInput.value = '';
            return;
          }

          if (file.size > 10 * 1024 * 1024) {
            syllabusError.textContent = '파일 크기가 너무 큽니다. 10MB 이하의 파일을 선택해 주세요.';
            syllabusFileInput.value = '';
            return;
          }

          try {
            if (isPdf) {
              const base64 = await readFileAsBase64(file);
              attachedPdfFile = {
                name: file.name,
                mimeType: 'application/pdf',
                base64: base64,
                size: file.size
              };
              syllabusAttachedName.textContent = file.name + ' (PDF)';
              syllabusAttachedSize.textContent = formatFileSize(file.size);
              syllabusAttachedBar.hidden = false;
            } else {
              const csvText = await readCsvFileText(file);
              attachedPdfFile = null;
              syllabusTextarea.value = csvText;
              syllabusAttachedName.textContent = file.name + ' (CSV · 아래 입력창에 불러옴)';
              syllabusAttachedSize.textContent = formatFileSize(file.size);
              syllabusAttachedBar.hidden = false;
            }
          } catch (err) {
            syllabusError.textContent = '파일을 읽는 중 오류가 발생했습니다.';
          }
        }

        analyzeSyllabusBtn.addEventListener('click', async function () {
          const text = syllabusTextarea.value.trim();
          const defaultCourse = syllabusDefaultCourse.value.trim();

          if (!text && !attachedPdfFile) {
            syllabusError.textContent = 'PDF/CSV 파일을 선택하거나 강의계획서 문장을 붙여넣어 주세요.';
            syllabusTextarea.focus();
            return;
          }

          syllabusError.textContent = '';
          analyzeSyllabusBtn.disabled = true;
          analyzeSyllabusBtn.textContent = '분석 중...';

          try {
            const payload = {
              text: text,
              defaultCourse: defaultCourse,
              currentYear: new Date().getFullYear()
            };
            if (attachedPdfFile) {
              payload.file = {
                name: attachedPdfFile.name,
                mimeType: attachedPdfFile.mimeType,
                base64: attachedPdfFile.base64
              };
            }

            const response = await fetch('/api/syllabus/parse', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await response.json();
            if (!response.ok) {
              syllabusError.textContent = data.error || '분석 중 오류가 발생했습니다.';
              return;
            }

            const list = Array.isArray(data.assignments) ? data.assignments : [];
            if (list.length === 0) {
              extractedSyllabusItems = [];
              renderSyllabusPreview();
              syllabusError.textContent = '마감일이 포함된 과제를 찾지 못했습니다. 문서나 문장에 날짜와 과제 내용이 포함되었는지 확인해 주세요.';
              return;
            }

            extractedSyllabusItems = list.map(function (item) {
              return {
                selected: true,
                course: (item.course || defaultCourse || '').trim(),
                title: (item.title || '').trim(),
                dueDate: item.dueDate || '',
                priority: item.priority || '중'
              };
            });
            renderSyllabusPreview();
          } catch (err) {
            syllabusError.textContent = '서버와 통신할 수 없습니다. 잠시 후 다시 시도해 주세요.';
          } finally {
            analyzeSyllabusBtn.disabled = false;
            analyzeSyllabusBtn.textContent = '분석하기';
          }
        });

        syllabusPreviewList.addEventListener('input', function (e) {

          if (!row) return;
          const idx = Number(row.getAttribute('data-syllabus-idx'));
          const field = e.target.getAttribute('data-sfield');
          if (!field || !extractedSyllabusItems[idx]) return;

          if (field === 'selected') {
            extractedSyllabusItems[idx].selected = Boolean(e.target.checked);
            updateSyllabusImportButtonState();
          } else {

        syllabusPreviewList.addEventListener('change', function (e) {
          const row = e.target.closest('[data-syllabus-idx]');
          if (!row) return;
          const idx = Number(row.getAttribute('data-syllabus-idx'));
          const field = e.target.getAttribute('data-sfield');
          if (!field || !extractedSyllabusItems[idx]) return;

          if (field === 'selected') {
            extractedSyllabusItems[idx].selected = Boolean(e.target.checked);
            updateSyllabusImportButtonState();
          } else {
            extractedSyllabusItems[idx][field] = e.target.value;
          }
        });

        syllabusPreviewList.addEventListener('click', function (e) {
          const removeBtn = e.target.closest('[data-saction="remove"]');
          if (!removeBtn) return;
          const row = removeBtn.closest('[data-syllabus-idx]');
          if (!row) return;
          const idx = Number(row.getAttribute('data-syllabus-idx'));
          extractedSyllabusItems.splice(idx, 1);
          renderSyllabusPreview();
        });

        importAllSyllabusBtn.addEventListener('click', function () {
          const selectedItems = extractedSyllabusItems.filter(function (item) {
            return item.selected;
          });

          if (selectedItems.length === 0) return;

          for (let i = 0; i < selectedItems.length; i += 1) {
            const item = selectedItems[i];
            if (!item.course.trim()) {
              syllabusError.textContent = '과목명이 비어 있는 항목이 있습니다. 과목명을 입력한 뒤 추가해 주세요.';
              return;
            }
            if (!item.title.trim()) {
              syllabusError.textContent = '과제명이 비어 있는 항목이 있습니다. 과제명을 입력한 뒤 추가해 주세요.';
              return;
            }
            if (!item.dueDate || !parseLocalDate(item.dueDate)) {
              syllabusError.textContent = '올바르지 않은 마감일이 있습니다. 날짜를 확인해 주세요.';
              return;
            }
          }

          syllabusError.textContent = '';
          const now = Date.now();
          let hasOutsideWeek = false;

          selectedItems.forEach(function (item, idx) {
            const dueDate = item.dueDate.trim();
            if (!isDateInCurrentWeek(dueDate)) {
              hasOutsideWeek = true;
            }
            tasks.push({
              id: 'task-' + (now + idx) + '-' + Math.random().toString(36).slice(2, 7),
              course: item.course.trim(),
              title: item.title.trim(),
              dueDate: dueDate,
              priority: item.priority || '중',
              completed: false,
              createdAt: now + idx
            });
          });

          saveTasks(tasks);
          extractedSyllabusItems = [];
          clearAttachedSyllabusFile(true);
          syllabusDefaultCourse.value = '';
          renderSyllabusPreview();
          closeSyllabusModal();

          if (activeTab === 'completed' || (activeTab === 'week' && hasOutsideWeek)) {
            setActiveTab('all');
          } else {
            renderBoard();
          }

          lastDeletedTask = null;
          toastMessage.textContent = selectedItems.length + '건의 과제를 등록했습니다.';
          toastUndoBtn.hidden = true;
          toastRegion.classList.add('is-visible');
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toastRegion.classList.remove('is-visible');
            toastUndoBtn.hidden = false;
          }, 4000);
        });

        function escapeIcsText(value) {
          return String(value)
            .replace(/\\/g, '\\\\')
            .replace(/\r\n|\r|\n/g, '\\n')
            .replace(/;/g, '\\;')
            .replace(/,/g, '\\,');
        }

        function formatIcsDateCompact(date) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          return y + m + d;
        }

        function formatIcsUtcStamp(date) {
          const y = date.getUTCFullYear();
          const m = String(date.getUTCMonth() + 1).padStart(2, '0');
          const d = String(date.getUTCDate()).padStart(2, '0');
          const hh = String(date.getUTCHours()).padStart(2, '0');
          const mm = String(date.getUTCMinutes()).padStart(2, '0');
          const ss = String(date.getUTCSeconds()).padStart(2, '0');
          return y + m + d + 'T' + hh + mm + ss + 'Z';
        }

        function showInfoToast(message) {
          lastDeletedTask = null;
          toastMessage.textContent = message;
          toastUndoBtn.hidden = true;
          toastRegion.classList.add('is-visible');
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toastRegion.classList.remove('is-visible');
            toastUndoBtn.hidden = false;
          }, 4000);
        }

        exportCalendarBtn.addEventListener('click', function () {
          const activeTasks = sortTasks(tasks).filter(function (t) {
            return !t.completed && parseLocalDate(t.dueDate);
          });

          if (activeTasks.length === 0) {
            showInfoToast('내보낼 진행 중인 과제가 없습니다.');
            return;
          }

          const nowStamp = formatIcsUtcStamp(new Date());
          const lines = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'PRODID:-//Campus Deadline Planner//KR',
            'CALSCALE:GREGORIAN',
            'METHOD:PUBLISH',
            'X-WR-CALNAME:캠퍼스 과제 마감 일정'
          ];

          activeTasks.forEach(function (t) {
            const startDate = parseLocalDate(t.dueDate);
            const endDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + 1);
            const summary = '[' + t.course + '] ' + t.title;

            const descParts = ['중요도: ' + (t.priority || '중')];
            if (t.isGroup && Array.isArray(t.teamMembers) && t.teamMembers.length > 0) {
              descParts.push('역할 분담표:');
              t.teamMembers.forEach(function (m) {
                descParts.push('- ' + (m.name || '미정') + ': ' + (m.role || '역할 미입력'));
              });
            }

            lines.push('BEGIN:VEVENT');
            lines.push('UID:' + escapeIcsText(t.id + '@campus-deadline-planner'));
            lines.push('DTSTAMP:' + nowStamp);
            lines.push('DTSTART;VALUE=DATE:' + formatIcsDateCompact(startDate));
            lines.push('DTEND;VALUE=DATE:' + formatIcsDateCompact(endDate));
            lines.push('SUMMARY:' + escapeIcsText(summary));
            lines.push('DESCRIPTION:' + escapeIcsText(descParts.join('\n')));
            lines.push('BEGIN:VALARM');
            lines.push('ACTION:DISPLAY');
            lines.push('DESCRIPTION:' + escapeIcsText(summary + ' 마감 하루 전입니다.'));
            lines.push('TRIGGER:-P1D');
            lines.push('END:VALARM');
            lines.push('END:VEVENT');
          });

          lines.push('END:VCALENDAR');

          const icsContent = lines.join('\r\n') + '\r\n';
          const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'campus-deadlines.ics';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);

          showInfoToast('진행 중인 과제 ' + activeTasks.length + '건을 .ics 파일로 내보냈습니다.');
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            if (!syllabusModalBackdrop.hidden) {
              closeSyllabusModal();
            } else if (!deleteModalBackdrop.hidden) {
              closeDeleteModal();
            } else if (composerPanel.classList.contains('is-open')) {
              closeMobileComposer();
            }
          }
        });

        // Boot
        initTodayHeader();
        renderBoard();
      })();
    </script>
  </body>
</html>
